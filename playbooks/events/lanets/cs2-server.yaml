---
# Déploie le serveur CS2 depuis l'image publiée, avec Docker Compose.
# Hôtes : cs2
# Usage : make events/lanets/cs2-server

- name: Deploying the CS2 server with Docker Compose
  hosts: cs2
  become: true
  tasks:
    - name: Install Docker, pull the published image, and run CS2
      ansible.builtin.include_role:
        name: lanets.cs2.csm
